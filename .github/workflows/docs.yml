# Builds the MkDocs site plus the Doxygen API reference and publishes the
# combined result to GitHub Pages. Replaces the GitLab Pages `pages` job.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, and let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Build MkDocs site
        run: |
          pip install --upgrade pip
          pip install -r requirements-docs.txt
          mkdocs build --site-dir public

      - name: Build Doxygen API documentation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends doxygen graphviz
          mkdir -p docs/api
          doxygen Doxyfile

      # Copy Doxygen output into the MkDocs site
      - name: Merge API docs into the site
        run: |
          mkdir -p public/api
          cp -r docs/api/html/* public/api/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
