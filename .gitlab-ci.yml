# GitLab CI/CD configuration for CLAS12 Analysis Framework
# Builds and tests the framework, then builds and deploys documentation
# to GitLab Pages.

stages:
  - test
  - build
  - pages

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Cache pip packages between jobs
cache:
  paths:
    - .cache/pip

# Compile and run the unit-test suite against a ROOT-equipped image. The
# rootproject/root container ships ROOT, GCC, and the build essentials we
# need; we add meson, ninja, eigen, and lz4 on top.
build-and-test:
  stage: test
  image: rootproject/root:6.32.02-ubuntu24.04
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends
        build-essential ninja-build meson pkg-config
        libeigen3-dev liblz4-dev libfmt-dev
    - cpp --version
  script:
    - meson setup build --buildtype=debugoptimized
    - meson compile -C build
    - meson test -C build --print-errorlogs
  artifacts:
    when: on_failure
    paths:
      - build/meson-logs/
    expire_in: 1 week

# Static analysis: clang-format check + clang-tidy on the diff against
# the merge base. Allowed to fail while we burn down the existing
# warnings.
lint:
  stage: test
  image: silkeh/clang:18
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends git ninja-build meson pkg-config python3
    - apt-get install -y --no-install-recommends libeigen3-dev liblz4-dev libfmt-dev
  script:
    # ROOT is not in this image; we only need compile_commands.json to
    # exist for clang-tidy. Skip ROOT-dependent targets by stubbing
    # root-config and tolerating missing libs at the analysis stage.
    - clang-format --version
    - git ls-files '*.cpp' '*.hpp' | xargs -r clang-format --dry-run --Werror || true
    - |
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        BASE="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      else
        BASE=$(git merge-base HEAD origin/main 2>/dev/null || echo HEAD~1)
      fi
      CHANGED=$(git diff --name-only "$BASE"...HEAD -- '*.cpp' '*.hpp')
      if [ -z "$CHANGED" ]; then
        echo "No C++ files changed; skipping clang-tidy."
        exit 0
      fi
      echo "Will lint:"; printf '  %s\n' $CHANGED
      # Run clang-tidy without compile DB; rely on the tool's defaults.
      # This catches in-source issues; deeper checks need a real build.
      echo "$CHANGED" | xargs -r clang-tidy --quiet || true
  allow_failure: true

# Sanitizer build: catches use-after-free, leaks, undefined behaviour
# the optimised build hides. Allowed to fail until clean, so it is a
# signal job rather than a hard gate.
sanitizers:
  stage: test
  image: rootproject/root:6.32.02-ubuntu24.04
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends
        build-essential ninja-build meson pkg-config
        libeigen3-dev liblz4-dev libfmt-dev
  script:
    - meson setup build-asan --buildtype=debug -Db_sanitize=address,undefined
    - meson compile -C build-asan
    - meson test -C build-asan --print-errorlogs
  allow_failure: true
  artifacts:
    when: on_failure
    paths:
      - build-asan/meson-logs/
    expire_in: 1 week

# Build Doxygen API documentation
build-doxygen:
  stage: build
  image: alpine:latest
  before_script:
    - apk add --no-cache doxygen graphviz ttf-freefont
  script:
    - mkdir -p docs/api
    - doxygen Doxyfile
  artifacts:
    paths:
      - docs/api/html
      - docs/api/xml
    expire_in: 1 hour

# Build MkDocs documentation
build-mkdocs:
  stage: build
  image: python:3.11-slim
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements-docs.txt
  script:
    - mkdocs build --site-dir public
  artifacts:
    paths:
      - public
    expire_in: 1 hour

# Deploy to GitLab Pages
pages:
  stage: pages
  image: alpine:latest
  dependencies:
    - build-doxygen
    - build-mkdocs
  script:
    # Copy Doxygen output into the MkDocs site
    - mkdir -p public/api
    - cp -r docs/api/html/* public/api/
  artifacts:
    paths:
      - public
  only:
    - main
  environment:
    name: production
    url: https://mathieuouillon.gitlab.io/clas-framework
