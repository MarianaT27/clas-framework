# GitLab CI/CD configuration for CLAS12 Analysis Framework
# Builds and deploys documentation to GitLab Pages

stages:
  - build
  - pages

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Cache pip packages between jobs
cache:
  paths:
    - .cache/pip

# Build Doxygen API documentation
build-doxygen:
  stage: build
  image: alpine:latest
  before_script:
    - apk add --no-cache doxygen graphviz ttf-freefont
  script:
    - mkdir -p docs/api
    - doxygen Doxyfile
  artifacts:
    paths:
      - docs/api/html
      - docs/api/xml
    expire_in: 1 hour

# Build MkDocs documentation
build-mkdocs:
  stage: build
  image: python:3.11-slim
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements-docs.txt
  script:
    - mkdocs build --site-dir public
  artifacts:
    paths:
      - public
    expire_in: 1 hour

# Deploy to GitLab Pages
pages:
  stage: pages
  image: alpine:latest
  dependencies:
    - build-doxygen
    - build-mkdocs
  script:
    # Copy Doxygen output into the MkDocs site
    - mkdir -p public/api
    - cp -r docs/api/html/* public/api/
  artifacts:
    paths:
      - public
  only:
    - main
  environment:
    name: production
    url: https://mathieuouillon.gitlab.io/clas-framework
