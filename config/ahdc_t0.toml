# Configuration for the `ahdc_t0` binary.
#
# Run with:
#   ./build/analyses/ahdc_t0 --config config/ahdc_t0.toml
#
# Extracts the AHDC t0 (timing pedestal / leading edge of the drift-time
# spectrum) from the UNCALIBRATED `AHDC::adc` bank, per wire, for two samples:
#   - all hits, and
#   - hits on tracks only (classified via the calibrated `AHDC::hits.trackid`
#     joined to `AHDC::adc` by channel geometry).
# The input must be a HIPO file that contains `AHDC::adc` (and ideally
# `AHDC::hits` for the on-track sample).
#
# Schema:
#   [run]       — input/output/num_threads/percentage
#   [analysis]  — target/polarity (+ beam_energy/version metadata; unused here)
#   [AhdcT0Alg] — algorithm knobs; keys match the AhdcT0Config Property names.

[run]
input       = "/path/to/ahdc_sample.hipo"   # set to a real AHDC file
output      = "ahdc_t0.root"
num_threads = 8
percentage  = 100.0

[analysis]
# Parsed by the runner but not physically used by this analysis.
target      = "LD2"
polarity    = "Inbending"
beam_energy = 2.2
version     = "2.0"

# AhdcT0Alg knobs.
#   enable_histograms : master switch for booking + filling.
#   require_good_wf   : keep only good waveforms (wfType <= 2).
#   t0_min/t0_max/t0_bins : timing axis [ns] for every per-wire histogram.
#                           Default [-100, 1000] ns, 550 bins (2 ns/bin) — wide
#                           enough to hold all three columns (the max-ADC `time`
#                           tail reaches past 700 ns); narrow after a first look.
#   book_global       : also book the summed-over-wires spectra (/AHDC/t0/<col>/<sample>/global).
#   debug_geometry    : one-shot dump of the first event's adc/hits rows + keys,
#                       to validate the layer/wire convention on a new
#                       production. Leave false for normal runs.
#
# Event start-time subtraction. The AHDC reconstruction computes the drift time
# as `time = leadingEdgeTime - t0 - REC::Event.startTime` (exactly as the DC
# subtracts its RF-corrected start time), so the t0 calibration subtracts the
# SAME per-event start time here — otherwise the per-event start-time spread
# smears every per-wire spectrum at high luminosity (the 10.6 GeV "dome") while
# a stable elastic start time stays sharp. The t0 term is omitted (that is what
# the calibration solves for). A missing REC::Event falls back to raw times
# (with a warning). The before/after is always available without re-running:
#   /AHDC/diagnostics/start_time                      — the startTime spread
#   /AHDC/start_time_check/{raw,corrected}/<SL_L|global> — on-track let, raw vs corrected
#   subtract_start_time : fill the per-wire/global spectra with pickoff - startTime.
#   st_min/st_max/st_bins : axis for /AHDC/diagnostics/start_time [ns].
#
# Track-quality cuts (gate the on_track sample using the reconstructed
# AHDC::kftrack bank). The per-track variables are ALWAYS histogrammed under
# /AHDC/quality/ BEFORE the cuts, so inspect those plots (n_hits, chi2ndf, ...)
# first, then set the thresholds below. A cut of 0 disables that cut, so the
# defaults leave the on_track sample unchanged.
#   apply_track_quality : master switch for the cuts below.
#   track_nhits_min     : keep tracks with n_hits >= this (0 = off). 8 => "n_hits > 7".
#   track_chi2ndf_max   : keep tracks with chi2/ndf <= this (0 = off).
#   track_sumres_max    : keep tracks with |sum_residuals| <= this [mm] (0 = off).
#   track_ndf_offset    : ndf = n_hits - this (helix fit has 5 params).
#   q_* / q_bins        : axis ranges + bin count for the /AHDC/quality plots.
[AhdcT0Alg]
enable_histograms = true
require_good_wf   = true
t0_min            = -100.0
t0_max            = 1000.0
t0_bins           = 550
book_global       = true
# debug_geometry  = true

subtract_start_time = true     # fill spectra with leadingEdgeTime - REC::Event.startTime
st_min              = -50.0
st_max              = 150.0
st_bins             = 200

# Time-walk 2D: (pickoff - startTime) vs ADC amplitude, for all three pickoffs,
# on-track, per (SL,layer) + global, under /AHDC/timewalk/<col>_vs_adc/on_track/.
# leadingEdgeTime should be flat vs ADC; a slope = residual time walk. Tune
# adc_max to the data (read the overflow on a first look).
book_timewalk = true
adc_min       = 0.0
adc_max       = 4000.0
adc_bins      = 100
tw_time_bins  = 275

apply_track_quality = true
track_nhits_min     = 8       # "n_hits > 7"
track_chi2ndf_max   = 2.0
track_sumres_max    = 2.5
track_ndf_offset    = 5
