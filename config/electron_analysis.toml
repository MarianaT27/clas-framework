# Configuration for the `electron_analysis` binary.
#
# Run with:
#   ./electron_analysis --config config/electron_analysis.toml
#
# Schema:
#   [run]      — replaces the old --input/--output/--num_threads/--percentage
#   [analysis] — replaces --target/--polarity (and adds beam_energy/version)
#   [<AlgName>] — one section per algorithm; keys match the algorithm's
#                 declared `Property<T>` names. Missing keys fall back to
#                 the C++ default; unknown keys log a warning.

[run]
input       = "/Users/mathieuouillon/Documents/tmp/cj2/rec_clas_022050.evio.00000.hipo"
output      = "electron_analysis_LD2_Outbending.root"
num_threads = 8
percentage  = 100.0

[analysis]
target      = "LD2"
polarity    = "Outbending"
beam_energy = 10.53
version     = "2.0"

# EventMonitor has no configurable properties today; the empty section is
# tolerated (the framework only warns about *unknown* algorithm sections).
[EventMonitor]

# ElectronAnalysis Property toggles. Flip any of these to false to skip
# the corresponding cut without recompiling.
[ElectronAnalysis]
enable_chi2pid_cut       = true
enable_momentum_cut      = true
enable_vz_cut            = true
enable_sf_cut            = true
enable_pcal_fiducial_cut = true
enable_dc_chi2ndf_cut    = true
