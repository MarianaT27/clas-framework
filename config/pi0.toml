# Configuration for the `pi0` binary.
#
# Run with:
#   ./pi0 --config config/pi0.toml
#
# Schema:
#   [run]      — replaces the old --input/--output/--num_threads/--percentage
#   [analysis] — replaces --target/--polarity (and adds beam_energy/version)
#   [<AlgName>] — one section per algorithm; keys match the algorithm's
#                 declared `Property<T>` names. Missing keys fall back to
#                 the C++ default; unknown keys log a warning.
#
# Pipeline: EventMonitor → ElectronSelectionAlg → DISSelection
#           → PhotonSelection → Pi0Reconstruction
# Services: VzCorrectorService, ElectronCutsService, PhotonCutsService.

[run]
input       = "/Users/mathieuouillon/Documents/tmp/cj2/rec_clas_022050.evio.00000.hipo"
output      = "pi0_LD2_Outbending.root"
num_threads = 8
percentage  = 100.0

[analysis]
target      = "LD2"
polarity    = "Outbending"
beam_energy = 10.53
version     = "2.0"

# EventMonitor has no configurable properties today; the empty section is
# tolerated (the framework only warns about *unknown* algorithm sections).
[EventMonitor]

# ElectronSelectionAlg Property toggles. Flip any of these to false to skip
# the corresponding cut without recompiling.
[ElectronSelectionAlg]
enable_ntuple            = true
enable_chi2pid_cut       = true
enable_momentum_cut      = true
enable_vz_cut            = true
enable_sf_cut            = true
enable_pcal_fiducial_cut = true
enable_dc_edge_cut       = true
pcal_lv_min              = 9.0
pcal_lw_min              = 9.0
dc_r1_edge_min           = 1.88
dc_r2_edge_min           = 2.08
dc_r3_edge_min           = 8.62

# DIS event selection. The C++ default region is `full_phase_space()` here
# (the pi0 binary doesn't override it like pi0_multiplicity does), so the
# bounds below take effect.
[DISSelection]
q2_min        = 1.0
q2_max        = 100.0
w_min         = 2.0
w_max         = 100.0
y_min         = 0.0
y_max         = 0.85
enable_ntuple = true
enable_q2_cut = true
enable_w_cut  = true
enable_y_cut  = true

# Photon selection. `use_ai = true` engages the Catboost GBT classifier from
# PhotonCutsService; `false` falls back to the legacy energy/beta cuts only.
[PhotonSelection]
use_ai            = true
min_photon_energy = 0.2
min_beta          = 0.9
max_beta          = 1.1

# π⁰ → γγ reconstruction. Note: pi0.cpp also looks up the legacy key
# `mass_window` directly to seed the constructor; the Property below
# (pi0_mass_window) is the canonical knob and takes precedence.
[Pi0Reconstruction]
pi0_mass_window   = 0.2
min_photon_energy = 0.1
