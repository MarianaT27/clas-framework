# Configuration for the `pi0_multiplicity` binary.
#
# Run with:
#   ./pi0_multiplicity --config config/pi0_multiplicity.toml
#
# Schema:
#   [run]      — replaces the old --input/--output/--num_threads/--percentage
#   [analysis] — replaces --target/--polarity (and adds beam_energy/version)
#   [<AlgName>] — one section per algorithm; keys match the algorithm's
#                 declared `Property<T>` names. Missing keys fall back to
#                 the C++ default; unknown keys log a warning.
#
# Pipeline: EventMonitor → ElectronSelectionAlg → DISSelection
#           → PhotonSelection → Pi0Reconstruction → Pi0Analysis
# Services: VzCorrectorService, ElectronCutsService, PhotonCutsService.
#
# Pi0Analysis is the merged event-mixing + multiplicity-ratio algorithm.
# It writes the `pi0_pairs` flat per-pair RNTuple (same-event signal +
# mixed-event background) and the /Pi0Multiplicity + /Pi0EventMixing
# histogram directories.

[run]
input       = "/Users/mathieuouillon/Documents/tmp/cj2/rec_clas_022050.evio.00000.hipo"
output      = "pi0_multiplicity_LD2_Outbending.root"
num_threads = 8
percentage  = 100.0

[analysis]
target      = "LD2"
polarity    = "Outbending"
beam_energy = 10.53
version     = "2.0"

# hipo::chain I/O tuning. Leaving every key at 0 reproduces the legacy
# synchronous read path (one fread per record, no cache). Recommended
# starting point for ifarm / XRootD: prefetch_depth = 4,
# record_cache_bytes = "128MB", io_threads = 2. record_cache_bytes
# accepts a plain int (bytes) or a string with "KB" / "MB" / "GB".
# bank_filter is an optional whitelist of bank names that the chain
# parses on the consumer side (it doesn't change the network bytes,
# only the CPU spent decoding banks the analysis doesn't need).
[IO]
prefetch_depth     = 0
record_cache_bytes = 0
io_threads         = 0
network_read_chunk = 0
# bank_filter = ["REC::Particle", "REC::Event", "REC::Calorimeter"]

# EventMonitor has no configurable properties today; the empty section is
# tolerated (the framework only warns about *unknown* algorithm sections).
[EventMonitor]

# ElectronSelectionAlg Property toggles. Flip any of these to false to skip
# the corresponding cut without recompiling.
[ElectronSelectionAlg]
enable_ntuple            = true
enable_chi2pid_cut       = true
enable_momentum_cut      = true
enable_vz_cut            = true
enable_sf_cut            = true
enable_pcal_fiducial_cut = true
enable_dc_edge_cut       = true
pcal_lv_min              = 9.0
pcal_lw_min              = 9.0
dc_r1_edge_min           = 1.68
dc_r2_edge_min           = 2.0
dc_r3_edge_min           = 8.75

# DIS event selection. The binary's constructor hard-codes the kinematic
# region to `standard_dis_region()`, so the (q2, w, y) numeric limits
# below are only consulted if individual cut toggles are enabled and the
# DIS region check delegates to them.
[DISSelection]
q2_min        = 1.0
q2_max        = 100.0
w_min         = 2.0
w_max         = 100.0
y_min         = 0.0
y_max         = 0.85
enable_ntuple = true
enable_q2_cut = true
enable_w_cut  = true
enable_y_cut  = true

# Photon selection. `use_ai = true` engages the Catboost GBT classifier from
# PhotonCutsService; `false` falls back to the legacy energy/beta cuts only.
[PhotonSelection]
use_ai            = true
min_photon_energy = 0.2
min_beta          = 0.9
max_beta          = 1.1

# π⁰ → γγ reconstruction. Note: pi0_multiplicity.cpp also looks up the
# legacy key `mass_window` directly to seed the constructor; the Property
# below (pi0_mass_window) is the canonical knob and takes precedence.
[Pi0Reconstruction]
pi0_mass_window   = 0.2
min_photon_energy = 0.1

# Merged event-mixing + multiplicity algorithm.
#   max_pool_events: photon-pool depth per (Q², x_B, W, multiplicity, ν)
#                    bin used for mixed-event background. Larger →
#                    smoother background, more memory.
#   enable_ntuple:   write the `pi0_pairs` flat per-pair RNTuple.
[Pi0Analysis]
max_pool_events = 50
enable_ntuple   = true
