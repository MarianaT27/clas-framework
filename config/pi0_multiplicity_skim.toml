# Configuration for the `pi0_multiplicity_skim` binary.
#
# Run with:
#   ./pi0_multiplicity_skim --config config/pi0_multiplicity_skim.toml
#
# Or slice one big input across N concurrent processes:
#   ./build/tools/local_batch \
#       --exe ./build/analyses/pi0_multiplicity_skim \
#       --config config/pi0_multiplicity_skim.toml \
#       --slices 16 --concurrent 4 \
#       --output-dir /volatile/clas12/ouillon/pi0_skim_slices
#
# Pipeline (skim): EventMonitor -> ElectronSelectionAlg -> DISSelection
#                  -> PhotonSelection -> HipoEventWriter
# Services: VzCorrectorService, ElectronCutsService, PhotonCutsService.

[run]
input       = "/Users/mathieuouillon/Documents/tmp/cj2/rec_clas_022050.evio.00000.hipo"
output      = "pi0_skim_LD2_Outbending.root"
num_threads = 8
percentage  = 100.0

# The skim writes a second output file alongside the .root: a HIPO file
# containing every event that passed the selection chain. local_batch
# slices this file too — each process gets a unique
# `<base>_slice<i>.hipo` via the `--hipo-output` CLI override.
[skim]
hipo_output = "pi0_skim_LD2_Outbending.hipo"

[analysis]
target      = "LD2"
polarity    = "Outbending"
beam_energy = 10.53
version     = "2.0"

# hipo::chain I/O tuning. Same knobs as pi0_multiplicity.toml. Leaving
# everything at 0 reproduces the legacy synchronous read path.
[IO]
prefetch_depth     = 0
record_cache_bytes = 0
io_threads         = 0
network_read_chunk = 0

[EventMonitor]

[ElectronSelectionAlg]
enable_ntuple            = true
enable_chi2pid_cut       = true
enable_momentum_cut      = true
enable_vz_cut            = true
enable_sf_cut            = true
enable_pcal_fiducial_cut = true
enable_dc_edge_cut       = true
pcal_lv_min              = 9.0
pcal_lw_min              = 9.0
dc_r1_edge_min           = 1.68
dc_r2_edge_min           = 2.0
dc_r3_edge_min           = 8.75

[DISSelection]
q2_min        = 1.0
q2_max        = 100.0
w_min         = 2.0
w_max         = 100.0
y_min         = 0.0
y_max         = 0.85
enable_ntuple = true
enable_q2_cut = true
enable_w_cut  = true
enable_y_cut  = true

[PhotonSelection]
use_ai            = true
min_photon_energy = 0.2
min_beta          = 0.9
max_beta          = 1.1
