# Configuration for the `pion_analysis` binary.
#
# Run with:
#   ./pion_analysis --config config/pion_analysis.toml
#
# Schema:
#   [run]      — input/output/threads/percentage (replaces the old CLI flags)
#   [analysis] — target/polarity (+ beam_energy/version); the framework
#                merges these into every per-algorithm section as defaults,
#                so target/polarity reach ElectronSelection and PionAnalysis
#                without being repeated below.
#   [<AlgName>] — one section per algorithm instance; keys match the
#                 algorithm's declared config field names. Missing keys fall
#                 back to the C++ default; unknown keys log a warning.
#
# Pipeline (see analyses/pion/pion_analysis.cpp):
#   EventMonitor -> ElectronAnalysis (ElectronSelectionAlg) -> PionAnalysis
# Services: VzCorrectorService, ElectronCutsService.

[run]
input       = "/Users/mathieuouillon/Documents/tmp/cj2/rec_clas_022050.evio.00000.hipo"
output      = "pion_analysis_LD2_Outbending.root"
num_threads = 8
percentage  = 100.0

[analysis]
target      = "LD2"
polarity    = "Outbending"
beam_energy = 10.53
version     = "2.0"

# EventMonitor has no configurable properties today; the empty section is
# tolerated (the framework only warns about *unknown* algorithm sections).
[EventMonitor]

# Trigger-electron selection. This binary registers ElectronSelectionAlg
# under the instance name "ElectronAnalysis", so its keys are the
# ElectronSelectionConfig fields. Flip any enable_* to false to skip the
# corresponding cut without recompiling; the *_min values tune the
# fiducial thresholds.
[ElectronAnalysis]
enable_ntuple            = true
enable_chi2pid_cut       = true
enable_momentum_cut      = true
enable_vz_cut            = true
enable_sf_cut            = true
enable_pcal_fiducial_cut = true
enable_dc_edge_cut       = true
pcal_lv_min              = 9.0
pcal_lw_min              = 9.0
dc_r1_edge_min           = 1.88
dc_r2_edge_min           = 2.08
dc_r3_edge_min           = 8.62

# Pion analysis (pi+ / pi-). min_momentum is the active momentum cut
# applied when enable_momentum_cut = true; min_calo_energy gates the
# "Has Calorimeter" stage. Regardless of the active min_momentum, the
# algorithm also reports in its finalize summary how many forward-detector
# pions a cut at 0.3 / 0.5 / 0.7 / 1.0 GeV would remove, so the cost of
# each candidate momentum cut is visible from a single run.
[PionAnalysis]
min_momentum                = 0.3
min_calo_energy             = 0.01
enable_forward_detector_cut = true
enable_momentum_cut         = true
enable_calorimeter_cut      = true
enable_dc_track_cut         = true
